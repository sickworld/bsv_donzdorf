# Include once inside nginx http {}. Based on recovered URLs, 2026-10-08.
# Match the original request, not internal /index.html or error-page rewrites.
map $request_uri $bsv_legacy_target {
    default "";
    "~*^/(?:index\.php)?\?(?:[^&]*&)*(?:p|page_id)=84(?:&.*)?$" "https://bsv-donzdorf.de/#verein";
    "~*^/(?:index\.php)?\?(?:[^&]*&)*(?:p|page_id)=87(?:&.*)?$" "https://bsv-donzdorf.de/#parcours";
    "~*^/(?:index\.php)?\?(?:[^&]*&)*(?:p|page_id)=240(?:&.*)?$" "https://bsv-donzdorf.de/impressum.html";
    "~*^/index\.(?:php|html)\?(?:[^&]*&)*(?:p|page_id|attachment_id|s|feed|paged|preview)=" "";
    "~*^/home/?(?:\?.*)?$" "https://bsv-donzdorf.de/";
    "~*^/startseite/?(?:\?.*)?$" "https://bsv-donzdorf.de/";
    "~*^/index\.html/?(?:\?.*)?$" "https://bsv-donzdorf.de/";
    "~*^/index\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/";
    "~*^/parcours/?(?:\?.*)?$" "https://bsv-donzdorf.de/#parcours";
    "~*^/pages/parcours\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#parcours";
    "~*^/2020/04/07/willkommen\-auf\-unserem\-3d\-parcours/?(?:\?.*)?$" "https://bsv-donzdorf.de/#parcours";
    "~*^/verein/?(?:\?.*)?$" "https://bsv-donzdorf.de/#verein";
    "~*^/kontakt/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/anfahrt/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/preise/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/pages/anfahrt\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/pages/kontakt\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/pages/preise\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/pages/verein/kontakt\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/2020/05/20/parkplaetze/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/2025/09/16/neuer\-wegweiser\-zum\-3d\-bogenparcours\-orientierung\-leicht\-gemacht/?(?:\?.*)?$" "https://bsv-donzdorf.de/#besuch";
    "~*^/impressum/?(?:\?.*)?$" "https://bsv-donzdorf.de/impressum.html";
    "~*^/verein/impressum/?(?:\?.*)?$" "https://bsv-donzdorf.de/impressum.html";
    "~*^/pages/impressum\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/impressum.html";
    "~*^/datenschutz/?(?:\?.*)?$" "https://bsv-donzdorf.de/datenschutz.html";
    "~*^/datenschutzerklaerung/?(?:\?.*)?$" "https://bsv-donzdorf.de/datenschutz.html";
    "~*^/aktuelles/?(?:\?.*)?$" "https://bsv-donzdorf.de/#aktuelles";
    "~*^/neuigkeiten/?(?:\?.*)?$" "https://bsv-donzdorf.de/#aktuelles";
    "~*^/pages/kalender\.php/?(?:\?.*)?$" "https://bsv-donzdorf.de/#aktuelles";
    "~*^/2022/09/25/bogenverleih\-in\-donzdorf/?(?:\?.*)?$" "https://staufen-events.de/angebot/bogenverleih/";
    "~*^/2025/09/12/viele\-schuetzinnen\-und\-schuetzen\-fragen\-uns\-ob\-sie\-mit\-ihrer\-eigenen\-bogenausruestung\-auf\-unserem\-vereinsparcours\-trainieren\-duerfen/?(?:\?.*)?$" "https://staufen-events.de/2025/09/10/mit-eigener-ausruestung-auf-dem-parcours-kein-problem/";
    "~*^/category/allgemein(?:/page/[0-9]+)?/?(?:\?.*)?$" "https://bsv-donzdorf.de/#aktuelles";
    "~*^/page/[0-9]+/?(?:\?.*)?$" "https://bsv-donzdorf.de/#aktuelles";
}

# Unknown WordPress content IDs/search/feed must not become a 200 homepage.
map "$bsv_legacy_target:$request_uri" $bsv_retired_query {
    default 0;
    "~*^:/(?:index\.(?:php|html))?\?(?:[^&]*&)*(?:p|page_id|attachment_id|s|feed|paged|preview)=" 1;
}
