# Include inside the canonical HTTPS server. root is set by the server.
include /etc/nginx/bsv/redirect-check.conf;
error_page 404 /404.html;
charset utf-8;

location = / {
    if ($bsv_retired_query) { return 404; }
    try_files /index.html =404;
}
location = /index.html {
    if ($bsv_retired_query) { return 404; }
    try_files $uri =404;
}
location = /404.html { internal; }
# No WordPress runtime, SPA fallback, directory listing, or PHP source serving.
location ~ /\. { return 404; }
location ~* \.php(?:/|$) { return 404; }
location / { try_files $uri =404; }
